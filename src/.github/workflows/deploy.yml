name: Deploy Automático para AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Preparar o Java 21 na máquina do GitHub
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: 3. Compilar o projeto (Criar o pacote .jar)
        run: mvn clean package -DskipTests

      - name: 4. Fazer o Upload para a AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.ACESSKEY_PUBLIC_AWS }}
          aws_secret_key: ${{ secrets.ACESSKEY_SECRET_AWS }}
          application_name: EventFlowgGO
          environment_name: EventFlowgGo-env # Confirme se esse é o nome exato do ambiente na AWS
          version_label: "versao-${{ github.run_number }}"
          region: us-east-1
          deployment_package: target/EventFlowGO-0.0.1-SNAPSHOT.jar