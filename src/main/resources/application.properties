spring.application.name=EventFlowGO

SERVER.PORT=5000

spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configurações AWS SQS
spring.cloud.aws.credentials.access-key=${ACESSKEY_PUBLIC_AWS}
spring.cloud.aws.credentials.secret-key=${ACESSKEY_SECRET_AWS}
spring.cloud.aws.region.static=us-east-1

#Variavel da fila da AWS sqs
aws.sqs.queue.inscricoes.name=inscricoes-pendentes-queue